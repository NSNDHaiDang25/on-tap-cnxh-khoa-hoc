<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ôn tập CNXH Khoa học</title>
  <meta name="description" content="Ôn tập trắc nghiệm môn Chủ nghĩa xã hội khoa học: luyện tập có giải thích, thi thử có bấm giờ, xem lại đáp án và tra cứu câu hỏi.">
  <meta name="theme-color" content="#fcf5ec">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">

  <!-- Phông chữ hỗ trợ tiếng Việt (khi không có mạng sẽ tự dùng phông hệ thống) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,600&display=swap">

  <link rel="stylesheet" href="css/style.css">

  <script>
    /* Áp dụng giao diện sáng/tối trước khi vẽ trang để tránh nháy màu */
    (function () {
      var theme = 'light';
      try {
        theme = localStorage.getItem('cnxhkh_theme') ||
          (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-action="skip">Bỏ qua điều hướng</a>

  <!-- Thanh điều hướng trên: linh vật mèo + các nút biểu tượng -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/home" aria-label="Về trang chủ">
        <img class="brand-mark" src="images/logo.svg" alt="" width="46" height="46">
        <span class="brand-text">
          <strong>CNXH Khoa học</strong>
          <small>Ôn tập trắc nghiệm</small>
        </span>
      </a>

      <nav class="topnav" aria-label="Điều hướng chính">
        <a class="nav-ic" href="#/home" data-nav="home" aria-label="Trang chủ" data-tip="Trang chủ">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        </a>
        <a class="nav-ic" href="#/setup" data-nav="setup" aria-label="Làm bài" data-tip="Làm bài">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </a>
        <a class="nav-ic" href="#/search" data-nav="search" aria-label="Tra cứu" data-tip="Tra cứu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </a>
        <a class="nav-ic" href="#/import" data-nav="import" aria-label="Thêm câu hỏi" data-tip="Thêm câu hỏi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        </a>
        <button class="nav-ic" id="theme-toggle" type="button" aria-label="Chuyển giao diện sáng/tối" data-tip="Sáng / tối"></button>
        <button class="avatar" type="button" data-action="cat-view" data-i="1" aria-label="Xem ảnh mèo">
          <img src="images/meo-2.jpg" alt="" width="40" height="40">
        </button>
      </nav>
    </div>
  </header>

  <!-- Nội dung: mỗi <section> là một "màn hình", do js/app.js hiển thị -->
  <main id="main" class="container" tabindex="-1">
    <section class="view" id="view-home"   data-view="home"></section>
    <section class="view" id="view-setup"  data-view="setup"></section>
    <section class="view" id="view-quiz"   data-view="quiz"></section>
    <section class="view" id="view-result" data-view="result"></section>
    <section class="view" id="view-review" data-view="review"></section>
    <section class="view" id="view-search" data-view="search"></section>
    <section class="view" id="view-import" data-view="import"></section>

    <noscript>
      <div class="card noscript">Trang web cần bật JavaScript để hoạt động.</div>
    </noscript>
  </main>

  <footer class="site-footer container">
    <p>Nội dung câu hỏi tham khảo Giáo trình <em>Chủ nghĩa xã hội khoa học</em> (dành cho bậc đại học hệ không chuyên lý luận chính trị). Tiến độ học tập được lưu ngay trên trình duyệt của bạn.</p>
  </footer>

  <div class="modal-root" id="modal" hidden></div>
  <div class="toast-root" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Dữ liệu câu hỏi phải nạp TRƯỚC app.js -->
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
